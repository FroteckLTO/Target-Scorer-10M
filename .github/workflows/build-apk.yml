name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: AI-Target-Scorer-10M-debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Publish direct APK download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete v0.1-debug --yes || true
          gh release create v0.1-debug app/build/outputs/apk/debug/app-debug.apk --title "AI Target Scorer 10M - Debug" --notes "Prototype camera and zoom only; automatic scoring not implemented." --prerelease
